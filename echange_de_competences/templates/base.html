<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Echange de compétences{% endblock %}</title>
</head>
<body>

<nav>
    <a href="{% url 'skills:all-skills' %}">Les compétences du site</a>
    <a href="{% url 'skills:help-requests-planned' %}">Demandes planifiées</a>

    {% if user.is_authenticated %}
        <a href="{% url 'skills:my-skills' %}">Mes compétences</a>
        <span>
            Connecté en tant que : {{ user.username }}
            <form action="{% url 'skills:logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Déconnexion</button>
            </form>
        </span>
    {% else %}
            <a href="{% url 'skills:login' %}">Connexion</a>
    {% endif %}
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
